name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production-vems-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, validate and deploy vems-v2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Lint
        run: npm run lint

      - name: Next.js production build
        run: npm run build

      - name: Build OpenNext Cloudflare bundle
        run: npx opennextjs-cloudflare build

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Worker vems-v2
        run: npx opennextjs-cloudflare deploy

      - name: Deployment summary
        if: success()
        run: |
          echo "## VEMS-V2 Cloudflare Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`vems-v2\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production URL: https://vems-v2.massih-chitsaz.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build, lint, dry-run and deploy: PASS" >> "$GITHUB_STEP_SUMMARY"
