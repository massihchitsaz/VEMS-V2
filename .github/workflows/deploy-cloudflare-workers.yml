name: Deploy VEMS-V2 to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - deployments/cloudflare-production.json
  workflow_dispatch:

concurrency:
  group: vems-v2-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.VEMS_TOKEN_NEW }}
      TARGET_URL: https://vems-v2.massih-chitsaz.workers.dev
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Show runtime
        id: runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare authentication
        id: auth
        shell: bash
        run: |
          set -o pipefail
          npx wrangler whoami 2>&1 | tee cloudflare-auth.log

      - name: Production quality gates
        id: quality
        run: npm run build

      - name: Build OpenNext for Cloudflare
        id: cfbuild
        run: npx opennextjs-cloudflare build

      - name: Deploy canonical VEMS-V2 Worker
        id: cfdeploy
        run: npx opennextjs-cloudflare deploy

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CFBUILD_OUTCOME: ${{ steps.cfbuild.outcome }}
          CFDEPLOY_OUTCOME: ${{ steps.cfdeploy.outcome }}
        run: |
          mkdir -p deployments
          python - <<'PY'
          import json, os, datetime, pathlib, re
          stages = {
            "runtime": os.environ.get("RUNTIME_OUTCOME", "unknown"),
            "install": os.environ.get("INSTALL_OUTCOME", "unknown"),
            "cloudflare_auth": os.environ.get("AUTH_OUTCOME", "unknown"),
            "quality_gates": os.environ.get("QUALITY_OUTCOME", "unknown"),
            "cloudflare_build": os.environ.get("CFBUILD_OUTCOME", "unknown"),
            "cloudflare_deploy": os.environ.get("CFDEPLOY_OUTCOME", "unknown")
          }
          auth_log = ""
          p = pathlib.Path("cloudflare-auth.log")
          if p.exists():
              auth_log = p.read_text(encoding="utf-8", errors="replace")[-2500:]
              auth_log = re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+\-/=]+', r'\1[REDACTED]', auth_log)
              auth_log = re.sub(r'(?i)(token[^\n:=]*[:=]\s*)[^\s]+', r'\1[REDACTED]', auth_log)
          payload = {
            "status": "success" if stages["cloudflare_deploy"] == "success" else "failed",
            "target": os.environ["TARGET_URL"],
            "source_commit": os.environ["GITHUB_SHA"],
            "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "stages": stages,
            "cloudflare_auth_diagnostic": auth_log,
            "workflow": "deploy-cloudflare-workers.yml"
          }
          with open("deployments/cloudflare-production.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/cloudflare-production.json
          git diff --cached --quiet || git commit -m "Record Cloudflare deployment result [skip cf-deploy]"
          git push
