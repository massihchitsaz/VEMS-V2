name: Deploy VEMS-V2 to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - deployments/cloudflare-production.json
  workflow_dispatch:

concurrency:
  group: vems-v2-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.VEMS_TOKEN_NEW }}
      TARGET_URL: https://vems-v2.massih-chitsaz.workers.dev
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Show runtime
        id: runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        id: install
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare authentication
        id: auth
        shell: bash
        run: |
          set -o pipefail
          npx wrangler whoami 2>&1 | tee cloudflare-auth.log

      - name: Production quality gates
        id: quality
        run: npm run build

      - name: Build OpenNext for Cloudflare
        id: cfbuild
        run: npx opennextjs-cloudflare build

      - name: Deploy canonical VEMS-V2 Worker
        id: cfdeploy
        run: npx opennextjs-cloudflare deploy

      - name: Production route smoke test
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          routes=("/" "/login" "/approvals" "/tasks" "/notifications" "/documents" "/inventory" "/quotations" "/shipping/shipments" "/operations" "/finance")
          for route in "${routes[@]}"; do
            echo "Checking $TARGET_URL$route"
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /tmp/vems-smoke.html -w "%{http_code}" --max-time 25 "$TARGET_URL$route" || true)
              if [[ "$code" =~ ^(200|204|301|302|303|307|308)$ ]]; then ok=1; break; fi
              echo "Attempt $attempt returned HTTP $code; retrying..."
              sleep 3
            done
            if [ "$ok" -ne 1 ]; then
              echo "Production smoke failed for $route"
              exit 1
            fi
          done
          echo "All production routes passed HTTP smoke checks."

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          CFBUILD_OUTCOME: ${{ steps.cfbuild.outcome }}
          CFDEPLOY_OUTCOME: ${{ steps.cfdeploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo '## VEMS-V2 Cloudflare deployment'
            echo
            echo "- Target: $TARGET_URL"
            echo "- Runtime: $RUNTIME_OUTCOME"
            echo "- Install: $INSTALL_OUTCOME"
            echo "- Cloudflare authentication: $AUTH_OUTCOME"
            echo "- Production quality gates: $QUALITY_OUTCOME"
            echo "- Cloudflare build: $CFBUILD_OUTCOME"
            echo "- Cloudflare deploy: $CFDEPLOY_OUTCOME"
            echo "- Production route smoke: $SMOKE_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
